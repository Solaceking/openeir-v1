# OpenEir Android — build the companion APK.
#
# GitHub-hosted ubuntu runners include the Android SDK, so this costs zero
# Actions minutes on a public repo. Signed release builds need four repo
# secrets (see docs/MOBILE.md "Releases"):
#   OPENEIR_KEYSTORE_B64        base64 of the .keystore file
#   OPENEIR_KEYSTORE_PASSWORD   keystore password
#   OPENEIR_KEY_ALIAS           key alias
#   OPENEIR_KEY_PASSWORD        key password
# Without them the workflow still ships an unsigned release APK for testing.

name: Android build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Prepare signing keystore
        if: env.OPENEIR_KEYSTORE_B64 != ''
        env:
          OPENEIR_KEYSTORE_B64: ${{ secrets.OPENEIR_KEYSTORE_B64 }}
        run: |
          echo "$OPENEIR_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/openeir-release.keystore"
          echo "OPENEIR_KEYSTORE=$RUNNER_TEMP/openeir-release.keystore" >> "$GITHUB_ENV"
          echo "OPENEIR_KEYSTORE_PASSWORD=${{ secrets.OPENEIR_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "OPENEIR_KEY_ALIAS=${{ secrets.OPENEIR_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "OPENEIR_KEY_PASSWORD=${{ secrets.OPENEIR_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/release/*.apk dist/OpenEir.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenEir-APK
          path: dist/OpenEir.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/OpenEir.apk --clobber --repo "$GITHUB_REPOSITORY"
