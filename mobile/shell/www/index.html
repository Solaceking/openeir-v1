<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f7f2e9">
  <title>OpenEir</title>
  <style>
    /* Cream paper, flat mark, serif wordmark — the same identity as the web login. */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #f7f2e9; color: #292524; font-family: ui-sans-serif, system-ui, Roboto, sans-serif;
      padding: 24px; text-align: center;
    }
    .frame { pointer-events: none; position: fixed; inset: 14px; border: 1px solid rgba(41,37,36,.14); border-radius: 22px; }
    .logo {
      width: 96px; height: 96px; border-radius: 50%; overflow: hidden;
      box-shadow: 0 1px 2px rgba(41,37,36,.08), 0 0 0 1px rgba(41,37,36,.06);
      animation: breathe 4.5s ease-in-out infinite;
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    h1 { font-family: Georgia, 'Times New Roman', serif; font-weight: 500; font-size: 30px; letter-spacing: -.02em; margin: 18px 0 2px; }
    .tagline { font-family: Georgia, serif; font-style: italic; color: #78716c; font-size: 13.5px; margin: 0 0 30px; }
    .card { width: 100%; max-width: 380px; background: #fffdf8; border: 1px solid rgba(41,37,36,.12); border-radius: 16px; padding: 20px; text-align: left; }
    label { display: block; font-size: 12px; font-weight: 600; color: #57534e; margin-bottom: 6px; }
    input[type=url] {
      width: 100%; height: 46px; border: 1px solid rgba(41,37,36,.2); border-radius: 10px; background: #fff;
      padding: 0 13px; font-size: 15px; color: #292524; outline: none;
    }
    input[type=url]:focus { border-color: #0f766e; box-shadow: 0 0 0 3px rgba(15,118,110,.14); }
    .row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
    .switch { position: relative; width: 42px; height: 24px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #d6d0c4; border-radius: 999px; transition: .18s; }
    .slider:before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .18s; }
    input:checked + .slider { background: #0f766e; }
    input:checked + .slider:before { transform: translateX(18px); }
    .hint { font-size: 11.5px; color: #78716c; line-height: 1.45; }
    button {
      width: 100%; height: 46px; margin-top: 18px; border: 0; border-radius: 10px; background: #0f766e; color: #fffdf8;
      font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    button:disabled { opacity: .55; }
    button.secondary { background: transparent; color: #0f766e; border: 1px solid rgba(15,118,110,.4); margin-top: 10px; }
    .error { display: none; margin-top: 12px; border: 1px solid rgba(153,27,27,.25); background: rgba(153,27,27,.05); color: #991b1b; border-radius: 10px; padding: 9px 12px; font-size: 12.5px; line-height: 1.45; }
    .status { min-height: 18px; margin-top: 10px; font-size: 12px; color: #78716c; text-align: center; }
    .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .foot { margin-top: 26px; font-size: 11px; color: #a8a29e; max-width: 320px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="frame" aria-hidden="true"></div>
  <div class="logo"><img src="mascot.png" alt="" onerror="this.style.display='none'"></div>
  <h1>OpenEir</h1>
  <p class="tagline">Your health, your box, your rules.</p>

  <div class="card">
    <label for="server-url">OpenEir server address</label>
    <input id="server-url" type="url" inputmode="url" autocapitalize="off" autocorrect="off"
           spellcheck="false" placeholder="https://openeir.example.com" autofocus>

    <div class="row">
      <span class="switch">
        <input type="checkbox" id="allow-http">
        <span class="slider"></span>
      </span>
      <span class="hint">Allow plain HTTP — only for trusted home networks (e.g. <i>http://192.168.1.20:3000</i>)</span>
    </div>

    <div class="error" id="error" role="alert"></div>

    <button id="connect"><span class="spinner" id="spin"></span><span id="btn-label">Connect</span></button>
    <div class="status" id="status"></div>
  </div>

  <p class="foot">
    The app talks only to the server you enter here. Sign-in, your health data and the AI stay on
    that box — this shell stores nothing but the address.
  </p>

  <script src="app.js"></script>
</body>
</html>
