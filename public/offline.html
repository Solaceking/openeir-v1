<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenEir — offline</title>
<style>
  body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #f0fdfa; color: #134e4a;
         display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
  .card { text-align: center; max-width: 24rem; padding: 2rem; }
  .logo { width: 64px; height: 64px; margin: 0 auto 1rem; border-radius: 18px; background: #ffffff;
          display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  p { color: #4b7a75; font-size: .9rem; line-height: 1.55; }
  button { margin-top: 1.25rem; background: #0f766e; color: #fff; border: 0; border-radius: 10px;
           padding: .7rem 1.4rem; font-size: .95rem; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="44" height="44" viewBox="0 0 80 80" role="img" aria-label="OpenEir logo">
        <defs><linearGradient id="og" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d9488"/><stop offset="1" stop-color="#0f766e"/></linearGradient></defs>
        <rect x="30" y="10" width="20" height="60" rx="10" fill="url(#og)"/>
        <rect x="10" y="30" width="60" height="20" rx="10" fill="url(#og)" opacity="0.8"/>
        <circle cx="40" cy="40" r="6" fill="#ffffff"/>
      </svg>
    </div>
    <h1>You are offline</h1>
    <p>OpenEir could not reach your server. Any reading you record now is queued locally and will sync automatically the moment you are back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
